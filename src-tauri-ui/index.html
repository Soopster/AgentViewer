<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0d10;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash { text-align: center; }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #6cf0c2;
    margin: 0 auto 14px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  .label { font-size: 13px; letter-spacing: 0.02em; opacity: 0.7; }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div class="splash">
    <div class="dot"></div>
    <div class="label">Starting Agent Viewer&hellip;</div>
  </div>
</body>
</html>
