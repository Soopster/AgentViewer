<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Agent Viewer</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: dark;
    --bg: #07091c;
    --text: #dde3f5;
    --text-2: #7b8db0;
    --violet: #8b80f0;
    --cyan: #38d9f5;
    --green: #2dd4a0;
    --red: #f06060;
    --amber: #eaaa40;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
  }
  .glow-violet {
    width: 520px; height: 520px;
    top: -180px; left: -160px;
    background: radial-gradient(circle, rgba(139,128,240,.28), transparent 65%);
  }
  .glow-cyan {
    width: 520px; height: 520px;
    bottom: -200px; right: -160px;
    background: radial-gradient(circle, rgba(56,217,245,.16), transparent 65%);
  }
  .splash {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .mark { margin-bottom: 26px; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { opacity: .72; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-3px); }
  }
  h1 {
    margin: 0;
    font-family: 'Oxanium', monospace;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
  }
  h1 .accent { color: transparent; background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; }
  .tagline {
    margin-top: 12px;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--text-2);
    opacity: 0.85;
  }
  .progress {
    position: relative;
    width: 280px;
    height: 3px;
    margin-top: 40px;
    border-radius: 2px;
    background: rgba(221, 227, 245, 0.08);
    overflow: hidden;
  }
  .progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 38%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--violet), var(--cyan));
    box-shadow: 0 0 12px rgba(139, 128, 240, 0.5);
  }
  .progress-fill.indeterminate { animation: slide 1.5s ease-in-out infinite; }
  .progress-fill.determinate { width: 0%; animation: none; transition: width 0.45s ease; }
  @keyframes slide {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(285%); }
  }
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 18px;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--text-2);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(45, 212, 160, 0.6);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .error-panel {
    position: relative;
    z-index: 1;
    display: none;
    max-width: 460px;
    text-align: center;
    padding: 34px 40px;
    border: 1px solid rgba(240, 96, 96, 0.28);
    border-radius: 14px;
    background: rgba(240, 96, 96, 0.05);
  }
  .error-panel .err-icon {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 1px solid rgba(240, 96, 96, 0.4);
    color: var(--red);
    font-size: 20px;
    font-weight: 600;
    font-family: 'Oxanium', monospace;
  }
  .error-panel h2 {
    margin: 0 0 10px;
    font-family: 'Oxanium', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--red);
  }
  .error-panel .err-body {
    font-size: 13px;
    line-height: 1.65;
    color: var(--text-2);
  }
  .error-panel .err-hint {
    margin-top: 16px;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--amber);
    opacity: 0.8;
  }
  @media (prefers-reduced-motion: reduce) {
    .mark, .status-dot, .progress-fill { animation: none; }
  }
</style>
<script>
  (function () {
    // Runs before <body> is parsed, so buffer calls from the Rust backend
    // until the DOM elements exist, then flush.
    var queue = [];
    function el(id) { return document.getElementById(id); }
    function flush() {
      while (queue.length) {
        var e = queue.shift();
        if (e.k === 1) applyStatus(e.a);
        else if (e.k === 2) applyProgress(e.a);
        else applyError(e.a, e.b);
      }
    }
    function applyStatus(msg) {
      var node = el('splash-status');
      if (node) node.textContent = msg;
    }
    function applyProgress(p) {
      var bar = el('splash-bar-fill');
      if (!bar) return;
      var clamped = Math.max(0, Math.min(100, Number(p) || 0));
      bar.classList.remove('indeterminate');
      bar.classList.add('determinate');
      bar.style.width = clamped + '%';
    }
    function applyError(heading, body) {
      var splash = el('splash');
      var panel = el('splash-error');
      var head = el('splash-error-heading');
      var bodyNode = el('splash-error-body');
      if (splash) splash.style.display = 'none';
      if (panel) panel.style.display = 'block';
      if (head) head.textContent = heading;
      if (bodyNode) bodyNode.innerHTML = body;
    }
    window.__setSplashStatus = function (msg) {
      if (el('splash-status')) applyStatus(msg); else queue.push({ k: 1, a: msg });
    };
    window.__setSplashProgress = function (p) {
      if (el('splash-bar-fill')) applyProgress(p); else queue.push({ k: 2, a: p });
    };
    window.__setSplashError = function (heading, body) {
      if (el('splash-error')) applyError(heading, body); else queue.push({ k: 3, a: heading, b: body });
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', flush);
    } else {
      flush();
    }
  })();
</script>
</head>
<body>
  <div class="glow glow-violet"></div>
  <div class="glow glow-cyan"></div>
  <main id="splash" class="splash">
    <svg class="mark" width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="markGrad" x1="0" y1="0" x2="60" y2="60">
          <stop offset="0" stop-color="#8b80f0"/>
          <stop offset="1" stop-color="#38d9f5"/>
        </linearGradient>
      </defs>
      <rect x="5" y="5" width="50" height="50" rx="13" stroke="url(#markGrad)" stroke-width="2" opacity="0.9"/>
      <path d="M21 23l7 7-7 7" stroke="#38d9f5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="31" y1="36" x2="39" y2="36" stroke="#8b80f0" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="30" cy="30" r="16" stroke="#8b80f0" stroke-width="1" opacity="0.35" stroke-dasharray="2 5"/>
    </svg>
    <h1 class="wordmark">Agent <span class="accent">Viewer</span></h1>
    <div class="tagline">Unified session viewer for your coding agents</div>
    <div class="progress">
      <div id="splash-bar-fill" class="progress-fill indeterminate"></div>
    </div>
    <div class="status">
      <span class="status-dot"></span>
      <span id="splash-status">Starting Agent Viewer&hellip;</span>
    </div>
  </main>
  <div id="splash-error" class="error-panel" role="alert">
    <div class="err-icon">!</div>
    <h2 id="splash-error-heading">Something went wrong</h2>
    <div id="splash-error-body" class="err-body"></div>
    <div class="err-hint">Relaunch Agent Viewer to try again</div>
  </div>
</body>
</html>
