minimumReleaseAge: 10080
trustPolicy: no-downgrade
# A takeover is by definition a recent publish — minimumReleaseAge (7d) and
# no-downgrade still screen everything new. Packages that have sat unchanged
# in the registry for 6+ months keep tripping no-downgrade only because they
# predate npm provenance (semver@6, undici-types, react-redux, …); skip those.
trustPolicyIgnoreAfter: 259200
trustPolicyExclude:
  # Pre-provenance releases of packages whose newer versions are attested —
  # no-downgrade flags them as trust downgrades. Each verified 2026-06-12:
  # lockfile integrity matches the registry dist.integrity byte-for-byte,
  # not a takeover. semver@6 is Babel's pin; react-redux/reselect come in
  # via recharts.
  - semver@6.3.1
  - react-redux@9.2.0
  - reselect@5.1.1
  - effect@4.0.0-beta.70
  - '@effect/platform-node-shared@4.0.0-beta.70'
  # 2026-07-02 update-all: @pierre/diffs@1.2.12 pins these exact versions as
  # its own upstream deps. Same publisher account (pierrecomputer) as prior
  # attested releases; published by amadeusdemarzi, a maintainer since
  # 1.0.3/theming@0.0.1 (not a new identity) — Pierre's release pipeline
  # intermittently skips provenance on manual publishes (theming@0.0.1 hit
  # this same flag in the 2026-06-12 round). Registry dist.integrity verified
  # directly, not a takeover.
  - '@pierre/theme@1.1.0'
  - '@pierre/theming@0.0.2'
